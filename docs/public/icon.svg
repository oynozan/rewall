<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 810" width="680" height="810" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 2:1 dimetric projection: verticals stay vertical, horizontals slope at 0.5 -->

  <!-- White plate (gap + top-left + bottom-right squares) with the
       top-right and bottom-left squares cut out as transparent holes -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M20,20 L660,340 L660,790 L20,470 Z
           M340,205 L630,350 L630,550 L340,405 Z
           M50,260 L340,405 L340,605 L50,460 Z"/>

  <!-- Outer line -->
  <polygon points="20,20 660,340 660,790 20,470" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="miter"/>
</svg>
