# ==========================================================================
# CRE PROJECT SETTINGS FILE
# ==========================================================================
# The enclave reads its secret's records from Sepolia through the EVM capability,
# so the RPC below is load bearing rather than scaffolding
staging-settings:
    rpcs:
        - chain-name: ethereum-testnet-sepolia
          url: https://ethereum-sepolia-rpc.publicnode.com

# ==========================================================================
production-settings:
    rpcs:
        - chain-name: ethereum-testnet-sepolia
          url: https://ethereum-sepolia-rpc.publicnode.com
        - chain-name: ethereum-mainnet
          url: https://ethereum-rpc.publicnode.com
