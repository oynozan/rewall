# mcp.rewall.me, a Rewall MCP server behind TLS
#
# Copy to /etc/nginx/sites-available/mcp.rewall.me, symlink it into sites-enabled, then
#   sudo certbot --nginx -d mcp.rewall.me
#   sudo nginx -t && sudo systemctl reload nginx
#
# Two settings here are not optional. X-Forwarded-Proto is how the server knows the hop it answered
# arrived over TLS, and without it every credential sent to it is refused. Buffering off is how a
# Streamable HTTP response reaches the client as it is written rather than when it ends.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.rewall.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # A redirect would leak the seed in cleartext before the client ever saw it, so this refuses instead
    location /mcp {
        default_type application/json;
        return 403 '{"error":"send this over https"}';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.rewall.me;

    ssl_certificate /etc/letsencrypt/live/mcp.rewall.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.rewall.me/privkey.pem;

    # The default format logs no arbitrary header, which is what keeps callers' seeds out of the log.
    # Never add $http_x_rewall_seed to a log_format on this server.
    access_log /var/log/nginx/mcp.access.log;
    error_log /var/log/nginx/mcp.error.log;

    # A tool call carries a URL and a small body, never an upload
    client_max_body_size 64k;

    # Tells a client never to try port 80 again, where a credential would cross in the clear
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Streamable HTTP holds the response open, so nothing may sit in front of it
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
