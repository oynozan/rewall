<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="470" zoomAndPan="magnify" viewBox="0 0 352.5 172.499995" height="230" preserveAspectRatio="xMidYMid meet" version="1.0"><defs><g/><clipPath id="7bf80a3a3b"><path d="M 0.261719 47.46875 L 63.824219 47.46875 L 63.824219 123.75 L 0.261719 123.75 Z M 0.261719 47.46875 " clip-rule="nonzero"/></clipPath><clipPath id="ae9fc34f98"><rect x="0" width="264" y="0" height="127"/></clipPath></defs><style>
    .sq { animation-duration: 0.9s; animation-delay: 0.2s; animation-fill-mode: both; }
    .from-top    { animation-name: from-top; }
    .from-bottom { animation-name: from-bottom; }
    /* travel in from outside the viewBox, overshoot ~1.3 units past the resting spot, then ease back */
    @keyframes from-top {
      0%   { transform: translateY(-90px); animation-timing-function: cubic-bezier(0.55, 0, 0.6, 1); }
      70%  { transform: translateY(1.3px); animation-timing-function: cubic-bezier(0.2, 0, 0.3, 1); }
      100% { transform: translateY(0); }
    }
    @keyframes from-bottom {
      0%   { transform: translateY(90px);  animation-timing-function: cubic-bezier(0.55, 0, 0.6, 1); }
      70%  { transform: translateY(-1.3px); animation-timing-function: cubic-bezier(0.2, 0, 0.3, 1); }
      100% { transform: translateY(0); }
    }
