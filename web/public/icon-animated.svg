<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 810" width="680" height="810" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sq {
      animation-duration: 0.9s;
      animation-delay: 0.2s;
      animation-fill-mode: both;
    }
    .from-top    { animation-name: from-top; }
    .from-bottom { animation-name: from-bottom; }

    /* travel in, overshoot by 14px past the resting spot, then ease back */
    @keyframes from-top {
      0%   { transform: translateY(-430px); animation-timing-function: cubic-bezier(0.55, 0, 0.6, 1); }
      70%  { transform: translateY(14px);   animation-timing-function: cubic-bezier(0.2, 0, 0.3, 1); }
      100% { transform: translateY(0); }
    }
    @keyframes from-bottom {
      0%   { transform: translateY(430px);  animation-timing-function: cubic-bezier(0.55, 0, 0.6, 1); }
      70%  { transform: translateY(-14px);  animation-timing-function: cubic-bezier(0.2, 0, 0.3, 1); }
      100% { transform: translateY(0); }
    }
  </style>

  <!-- Static white plate with the whole 2x2 area cut out as a transparent hole -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M20,20 L660,340 L660,790 L20,470 Z
           M50,60 L630,350 L630,750 L50,460 Z"/>
  <polygon points="20,20 660,340 660,790 20,470" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="miter"/>

  <!-- Left square: drops in from the top and fills the top-left hole.
       Its top/left edges extend 3px into the white gap so no seam shows against the plate. -->
  <g class="sq from-top">
    <polygon points="47,55.5 340,202 340,405 47,258.5" fill="#ffffff"/>
  </g>

  <!-- Right square: rises in from the bottom and fills the bottom-right hole.
       Its right/bottom edges extend 3px into the white gap for the same reason. -->
  <g class="sq from-bottom">
    <polygon points="340,405 633,551.5 633,754.5 340,608" fill="#ffffff"/>
  </g>
</svg>
